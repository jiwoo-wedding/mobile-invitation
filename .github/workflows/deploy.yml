# main 브랜치에 푸시하면 자동으로 빌드해서 GitHub Pages 에 배포한다.
# (React 프로젝트는 빌드가 필요하므로, 파일을 그냥 올리는 방식으로는 배포되지 않는다)
#
# 최초 1회 설정: 레포지토리 Settings → Pages → Source 를 "GitHub Actions" 로 변경
# Supabase 를 쓴다면: Settings → Secrets and variables → Actions 에
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY 를 등록

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
